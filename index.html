<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fieldglass — Research Operations Desk</title>
<meta name="description" content="Fact-vs-allegation split-track, controlled relationship graph, Drive ingestion manifest, license triage."/>
<style>
:root{--bg:#0f0e0c;--fg:#ebe6d9;--muted:#9a9484;--line:#2a2823;--surface:#181612;--surface2:#1f1c17;--primary:#c4a35a;--primary-ink:#1a1508;--rust:#c45c3a;--ok:#6b9b6e;--font:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--display:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;min-height:100%}
a{color:var(--primary);text-decoration:none}button,input,select,textarea{font:inherit}
.shell{max-width:1100px;margin:0 auto;padding:1rem 1rem 5rem}
header.top{border-bottom:1px solid var(--line);background:var(--surface);margin:0 -1rem 1.25rem;padding:1rem}
header.top .inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;padding:0 1rem}
.brand{font-family:var(--display);font-size:1.75rem;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:.875rem;margin:.25rem 0 0}
nav.side{display:none}
@media(min-width:860px){
  .layout{display:grid;grid-template-columns:13rem 1fr;gap:1.5rem}
  nav.side{display:block}
  nav.side ul{list-style:none;padding:0;margin:0;position:sticky;top:1rem}
  nav.side a{display:flex;align-items:center;min-height:2.75rem;padding:.5rem .75rem;border-radius:6px;color:var(--muted)}
  nav.side a.active,nav.side a:hover{background:var(--surface2);color:var(--fg)}
  nav.side a.active{background:var(--primary);color:var(--primary-ink)}
}
nav.bottom{position:fixed;inset-inline:0;bottom:0;border-top:1px solid var(--line);background:var(--surface);display:flex;overflow-x:auto;z-index:20}
nav.bottom a{flex:1 0 4.5rem;text-align:center;padding:.6rem .35rem;font-size:.7rem;color:var(--muted)}
nav.bottom a.active{color:var(--primary)}
@media(min-width:860px){nav.bottom{display:none}}
h1{font-family:var(--display);font-size:2rem;margin:.25rem 0 .5rem;line-height:1.15}
.kicker{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);margin:0}
.lede{color:var(--muted);max-width:40rem;margin:0 0 1rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:.75rem}
.grid{display:grid;gap:.75rem}.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.85rem 1rem}
.stat b{font-family:var(--display);font-size:1.75rem;color:var(--primary);display:block}
.stat span{font-size:.85rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding:.5rem 1rem;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--rust)}
input,select,textarea{width:100%;min-height:2.75rem;padding:.5rem .75rem;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:5rem;resize:vertical}
label{display:block;font-size:.8rem;color:var(--muted);margin:.5rem 0 .25rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.badge{display:inline-block;font-size:.7rem;padding:.15rem .45rem;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--primary)}
.badge.bad{color:var(--rust);border-color:var(--rust)}
.list{list-style:none;padding:0;margin:0}
.list li{border:1px solid var(--line);border-radius:6px;padding:.65rem .75rem;margin-bottom:.4rem;background:var(--surface)}
.muted{color:var(--muted);font-size:.875rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}
.table{width:100%;border-collapse:collapse;font-size:.85rem}
.table th,.table td{border-bottom:1px solid var(--line);padding:.45rem .35rem;text-align:left;vertical-align:top}
.table th{color:var(--muted);font-weight:600}
.form-grid{display:grid;gap:.5rem}
@media(min-width:640px){.form-grid.cols2{grid-template-columns:1fr 1fr}}
.alert{padding:.75rem;border-radius:6px;border:1px solid var(--line);background:var(--surface2);margin-bottom:.75rem}
.alert.warn{border-color:var(--primary)}
.alert.bad{border-color:var(--rust)}
.alert.ok{border-color:var(--ok)}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="inner">
    <div><p class="brand">Fieldglass</p><p class="sub">Research operations desk · claims stay labeled until a record supports them</p></div>
    <p class="sub" style="text-align:right;max-width:16rem">Public-record ceiling. No attack tooling. Promote only with a pinpoint locator.</p>
  </div></header>
  <div class="layout">
    <nav class="side"><ul id="side-nav"></ul></nav>
    <main id="app"></main>
  </div>
</div>
<nav class="bottom" id="bottom-nav"></nav>
<script src="./app.js"></script>
</body>
</html>
